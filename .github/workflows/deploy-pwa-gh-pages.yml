name: Deploy Arcanum PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Copy APK to PWA assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/src/main/assets/pwa/arcanum.apk
          cp app/build/outputs/apk/debug/app-debug.apk arcanum.apk || true

      - name: Prepare GitHub Pages Deployment Folder
        run: |
          mkdir -p _public
          cp -r app/src/main/assets/pwa/* _public/
          mkdir -p _public/app/src/main/assets/pwa
          cp -r app/src/main/assets/pwa/* _public/app/src/main/assets/pwa/
          cp index.html _public/index.html
          cp app/build/outputs/apk/debug/app-debug.apk _public/arcanum.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
