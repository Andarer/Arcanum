name: Arcanum Multi-Channel Deployment & GitHub Pages Digital Factory

on:
  push:
    branches:
      - main
      - master
      - beta
      - nightly
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Deployment Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - nightly
          - experimental

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-channel:
    name: Build & Deploy Multi-Channel Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Multi-Channel Digital Factory Artifacts
        run: |
          mkdir -p _public
          cp -r app/src/main/assets/pwa/* _public/
          mkdir -p _public/app/src/main/assets/pwa
          cp -r app/src/main/assets/pwa/* _public/app/src/main/assets/pwa/
          cp index.html _public/landing.html || true
          cp app/build/outputs/apk/debug/app-debug.apk _public/arcanum.apk
          cp app/build/outputs/apk/debug/app-debug.apk _public/app/src/main/assets/pwa/arcanum.apk
          
          # Generate SHA256 Checksum
          sha256sum _public/arcanum.apk > _public/arcanum.apk.sha256
          
          # Generate Build Info Metadata
          cat <<EOF > _public/build-info.json
          {
            "version": "3.9.0",
            "channel": "${{ github.event.inputs.channel || 'stable' }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "architectureScore": 100
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
