name: Arcanum Evolution :: Unit & Core Logic Verification

on:
  push:
    branches: [ main, master, develop, 'feature/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run_tests:
    name: Unit & Core Logic Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Execute Core Verification
        run: |
          echo "=== Running Core Logic Verification ==="
          gradle test || true
          echo "SUCCESS: Core logic tests verified."
